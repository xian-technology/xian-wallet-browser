name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out xian-wallet-browser
        uses: actions/checkout@v7
        with:
          path: xian-wallet-browser

      - name: Check out xian-js
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-js
          ref: main
          path: xian-js

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            xian-js/package-lock.json
            xian-wallet-browser/package-lock.json

      - name: Install and build xian-js
        working-directory: xian-js
        run: |
          npm install
          npm run build

      - name: Install xian-wallet-browser dependencies
        working-directory: xian-wallet-browser
        run: npm install

      - name: Validate xian-wallet-browser
        working-directory: xian-wallet-browser
        run: npm run validate

      - name: Verify repo versions match tag
        working-directory: xian-wallet-browser
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const expected = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const packageFiles = [
            "package.json",
            "packages/wallet-core/package.json",
            "apps/wallet-extension/package.json"
          ];

          for (const file of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version !== expected) {
              throw new Error(`${file} has version ${pkg.version}, expected ${expected}`);
            }
          }

          function chromeExtensionVersion(version) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/);
            if (!match) {
              throw new Error(`unsupported version ${version}`);
            }
            const [, major, minor, patch, channel, number] = match;
            const offsets = { alpha: 10000, beta: 20000, rc: 30000 };
            const build = channel ? offsets[channel] + Number(number) : 65535;
            if (build > 65535) {
              throw new Error(`Chrome extension build component is too large for ${version}`);
            }
            return `${major}.${minor}.${patch}.${build}`;
          }

          const manifestFile = "apps/wallet-extension/public/manifest.json";
          const manifest = JSON.parse(fs.readFileSync(manifestFile, "utf8"));
          const expectedManifestVersion = chromeExtensionVersion(expected);
          if (manifest.version !== expectedManifestVersion) {
            throw new Error(
              `${manifestFile} has version ${manifest.version}, expected ${expectedManifestVersion}`
            );
          }
          if (manifest.version_name !== expected) {
            throw new Error(
              `${manifestFile} has version_name ${manifest.version_name}, expected ${expected}`
            );
          }
          NODE

      - name: Pack wallet-core and archive extension
        working-directory: xian-wallet-browser
        run: |
          mkdir -p release-dist
          npm pack --workspace @xian-tech/wallet-core --pack-destination release-dist
          (
            cd apps/wallet-extension/dist
            zip -r "../../../release-dist/xian-wallet-extension-${GITHUB_REF_NAME#v}.zip" .
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: xian-wallet-browser/release-dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: npm
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: release-dist

      - name: Publish wallet-core to npm
        run: |
          for package in release-dist/*.tgz; do
            metadata="$(
              tar -xOf "$package" package/package.json \
                | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const pkg = JSON.parse(input); console.log(pkg.name + "\t" + pkg.version); });'
            )"
            version="${metadata#*$'\t'}"
            publish_tag="latest"
            if [[ "${version}" == *"-"* ]]; then
              publish_tag="beta"
            fi
            npm publish "./$package" --provenance --access public --tag "${publish_tag}"
          done

  github-release:
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: release-dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "xian-wallet-browser ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${release_flags[@]}"
