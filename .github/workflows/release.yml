name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      xian_js_repository: ${{ steps.resolve.outputs.xian_js_repository }}
      xian_js_ref: ${{ steps.resolve.outputs.xian_js_ref }}
      xian_contracting_repository: ${{ steps.resolve.outputs.xian_contracting_repository }}
      xian_contracting_ref: ${{ steps.resolve.outputs.xian_contracting_ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          path: xian-wallet-browser
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"

      - name: Resolve immutable release context
        id: resolve
        working-directory: xian-wallet-browser
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: node ./scripts/release-context.mjs resolve

  build:
    needs: release-context
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_VERSION: 1.61.1
    permissions:
      contents: read
    steps:
      - name: Check out immutable wallet source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: xian-wallet-browser
          ref: ${{ needs.release-context.outputs.source_sha }}

      - name: Check out pinned xian-js source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ needs.release-context.outputs.xian_js_repository }}
          ref: ${{ needs.release-context.outputs.xian_js_ref }}
          path: xian-js

      - name: Check out pinned xian-contracting source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ needs.release-context.outputs.xian_contracting_repository }}
          ref: ${{ needs.release-context.outputs.xian_contracting_ref }}
          path: xian-contracting

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            xian-js/package-lock.json
            xian-wallet-browser/package-lock.json

      - name: Verify pinned source and package context
        working-directory: xian-wallet-browser
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.release-context.outputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node ./scripts/release-context.mjs verify-component

      - name: Install and build pinned xian-js
        working-directory: xian-js
        run: |
          npm ci
          npm run build

      - name: Install locked wallet dependencies
        working-directory: xian-wallet-browser
        run: npm ci

      - name: Verify Playwright image matches the lockfile
        working-directory: xian-wallet-browser
        run: node -e 'const actual = require("@playwright/test/package.json").version; if (actual !== process.env.PLAYWRIGHT_VERSION) throw new Error("Playwright " + actual + " does not match release image " + process.env.PLAYWRIGHT_VERSION)'

      - name: Audit production dependencies
        working-directory: xian-wallet-browser
        run: npm audit --audit-level=critical --omit=dev

      - name: Validate wallet workspace
        working-directory: xian-wallet-browser
        run: npm run validate

      - name: Run browser wallet checks
        timeout-minutes: 10
        working-directory: xian-wallet-browser
        run: timeout 600s npm run test:browser --workspace xian-wallet-extension

      - name: Run browser wallet visual checks
        timeout-minutes: 10
        working-directory: xian-wallet-browser
        run: timeout 600s npm run test:visual --workspace xian-wallet-extension

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-playwright-diagnostics
          path: |
            xian-wallet-browser/apps/wallet-extension/test-results
            xian-wallet-browser/apps/wallet-extension/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack wallet-core and archive extension
        working-directory: xian-wallet-browser
        run: |
          mkdir -p release-dist
          npm pack --workspace @xian-tech/wallet-core --pack-destination release-dist
          (
            cd apps/wallet-extension/dist
            zip -r "../../../release-dist/xian-wallet-extension-${GITHUB_REF_NAME#v}.zip" .
          )

      - name: Verify release artifact metadata
        working-directory: xian-wallet-browser
        env:
          ARTIFACT_DIRECTORY: release-dist
          RELEASE_TAG: ${{ github.ref_name }}
        run: node ./scripts/release-context.mjs verify-artifacts

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: xian-wallet-browser/release-dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - release-context
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: npm
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org

      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: release-dist

      - name: Publish wallet-core to npm
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(release-dist/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected one npm artifact, found ${#packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          metadata="$(
            tar -xOf "$package" package/package.json \
              | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const pkg = JSON.parse(input); console.log(pkg.name + "\t" + pkg.version); });'
          )"
          name="${metadata%%$'\t'*}"
          version="${metadata#*$'\t'}"
          if [ "${name}" != "@xian-tech/wallet-core" ] || [ "${version}" != "${EXPECTED_VERSION}" ]; then
            echo "Unexpected wallet package: ${name}@${version}" >&2
            exit 1
          fi

          if published_integrity="$(npm view "${name}@${version}" dist.integrity 2>/dev/null)"; then
            local_integrity="$(
              node - "$package" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const archive = fs.readFileSync(process.argv[2]);
          console.log(`sha512-${crypto.createHash("sha512").update(archive).digest("base64")}`);
          NODE
            )"
            if [ -z "${published_integrity}" ] || [ "${published_integrity}" != "${local_integrity}" ]; then
              echo "Published ${name}@${version} does not match the validated artifact" >&2
              exit 1
            fi
            echo "${name}@${version} already exists with matching integrity; skipping"
            exit 0
          fi

          publish_tag="latest"
          if [[ "${version}" == *"-"* ]]; then
            publish_tag="beta"
          fi
          npm publish "./$package" --provenance --access public --tag "${publish_tag}"

  github-release:
    needs:
      - release-context
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: release-dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "xian-wallet-browser ${RELEASE_VERSION}" \
            --generate-notes \
            "${release_flags[@]}"
